# BioLIP2 Binding Site Evaluation - AminoAseed Tokenizer
# Run with: python run_supervised_task.py --config-name=eval_biolip2_aminoaseed
defaults:
    - _self_
    - trainer: base
    - lightning: base
    - data: biolip2
    - optimization: base
    - autorestart: base

model:
    class_name: "SequenceClassificationModel"
    pretrained_ckpt_path: ""
    ckpt_path: null
    num_labels: 1
    dropout: 0.1
    num_layer: 1
    hidden_size: 512
    num_tokens: null  # Set automatically from tokenizer
    d_model: 1024     # AminoAseed embedding dimension
    is_global_or_local: local
    multi_label: false
    regression: false
    use_sequence: false  # Do NOT use sequence embeddings for fair comparison
    sequence_only: false
    add_noise: null

deepspeed_path: src/script/config/deepspeed/32_stage2.json
default_data_dir: /home/romainlhardy/data/protein/struct_token_bench_release_data/
tokenizer: WrappedOurPretrainedTokenizer
tokenizer_pretrained_ckpt_path: /home/romainlhardy/code/protein/models/codebook_512x1024-1e+19-linear-fixed-last.ckpt/checkpoint/mp_rank_00_model_states.pt
tokenizer_ckpt_name: AminoAseed

max_steps: 5000
experiment_name: biolip2_AminoAseed
run_name: structured_eval
validate_only: false
test_only: false

save_dir_path: ""
results_dir: /home/romainlhardy/code/protein/logs/eval_results/
tokenizer_device: "cuda"

trainer:
    default_root_dir: /home/romainlhardy/code/protein/logs/structtokenbench/
precompute_tokens: true

# AminoAseed-specific parameters
quantizer_use_linear_project: true
model_encoder_dmodel: 1024
model_encoder_nlayers: 2
model_encoder_vheads: 128
quantizer_codebook_size: 512
quantizer_codebook_embed_size: 1024
model_encoder_dout: 1024
