# Stage 1: Structure Foundation
# Goal: Learn high-quality structure tokens
#
# Training components:
#   - Structure Encoder: Train
#   - Structure Decoder: Train
#   - Codebook: Train
#   - Inverse Folding: Train
#   - Contrastive (optional): Train
#
# Losses: Structure reconstruction + inverse folding + contrastive alignment

defaults:
    - pretrain

model:
    training_stage: 1
    resume_from_stage: null

    # Use MCQ quantizer for better codebook utilization
    # codebook_embed_size must match encoder.d_out
    quantizer:
        quantizer_type: MCQQuantizer
        codebook_embed_size: 128  # Must match encoder.d_out
        num_codebooks: 8
        normalize_embeddings: true

    # Stage 1: No forward folding, sequence decoder, or alignment
    forward_folding:
        enabled: false

    sequence_decoder:
        enabled: false

    alignment:
        enabled: false

    function:
        enabled: false

# Stage 1 specific settings
experiment_name: stage1_structure
run_name: stage1_structure_run
