defaults:
    - _self_
    - trainer: base
    - lightning: pretrain
    - data: pretrain_pdb
    - optimization: base
    - autorestart: base
model:
    class_name: "VQVAEModel"
    pretrained_ckpt_path: "" # where to load the pretrained pLM
    ckpt_path: null
    quantizer:
        quantizer_type: StraightThroughQuantizer  # or MCQQuantizer
        loss_weight:
            commitment_loss_weight: 0.25
            quantization_loss_weight: 1.0
            reconstruction_loss_weight: 1.0
            entropy_loss_weight: 0.0  # MCQ only: weight for entropy loss
        codebook_size: 512
        codebook_embed_size: 128  # Must match encoder.d_out
        _need_init: true
        freeze_codebook: false
        use_linear_project: false
        # MCQ-specific parameters (only used when quantizer_type=MCQQuantizer)
        num_codebooks: 8            # Number of sub-codebooks
        use_entropy_loss: false     # Enable entropy loss for better codebook utilization
        entropy_temp: 0.01          # Temperature for entropy loss computation
        normalize_embeddings: true  # L2-normalize embeddings (cosine similarity vs L2)
        # Modality-specific codebook routing (optional, MCQ only)
        # When set, different modalities update different subsets of codebooks
        # Default: null (all codebooks shared, Option C used for forward folding)
        structure_codebooks: null   # e.g., [0, 1, 2, 3] - codebooks dedicated to structure
        sequence_codebooks: null    # e.g., [4, 5] - codebooks dedicated to sequence
        shared_codebooks: null      # e.g., [6, 7] - codebooks shared across modalities
    encoder:
        d_model: 1024
        n_heads: 1
        v_heads: 128
        n_layers: 2
        d_out: 128
    decoder:
        d_model: 1024
        n_heads: 16
        n_layers: 8
    forward_folding:
        enabled: false  # Set to true to enable
        loss_weight: 1.0  # Weight for forward folding loss
        skip_binned_losses: false  # Skip binned dist/dir losses to save memory
        sequence_encoder:
            vocab_size: 33  # ESM3 sequence vocabulary size
            d_model: 512    # Transformer hidden dimension
            n_heads: 8      # Number of attention heads
            n_layers: 4     # Number of transformer layers
            d_out: 128      # Must match encoder.d_out

    # Multi-stage training configuration
    training_stage: null  # 1, 2, 3, or 4 (null = standard training)
    resume_from_stage: null  # Path to previous stage checkpoint

    # Sequence decoder for sequence reconstruction (stages 2+)
    sequence_decoder:
        enabled: false
        d_model: 512      # Transformer hidden dimension
        n_heads: 8        # Number of attention heads
        n_layers: 4       # Number of transformer layers
        vocab_size: 33    # ESM3 sequence vocabulary size
        loss_weight: 1.0  # Weight for sequence reconstruction loss

    # Cross-modal alignment between structure and sequence (stages 2+)
    alignment:
        enabled: false
        temperature: 0.1   # Temperature for soft codebook assignments
        symmetric: true    # Use symmetric KL divergence
        loss_weight: 0.5   # Weight for alignment loss

    # Function encoder/decoder (stage 4)
    function:
        enabled: false
        encoder:
            d_model: 512
            n_heads: 8
            n_layers: 4
        decoder:
            d_model: 512
            n_heads: 8
            n_layers: 4
        loss_weight: 1.0

deepspeed_path: src/script/config/deepspeed/32_stage2.json
default_data_dir: null
tokenizer: null
max_steps: 10000
experiment_name: test # used for tensorboard
run_name: test_run
validate_only: false
test_only: false

save_dir_path: "" # would be indicated during running
tokenizer_device: "cuda" # or "cpu": where to put the tokenizer.tokenizer_encoder. 